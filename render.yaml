services:
  - type: web
    name: adsynthe-x
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GOOGLE_ADS_CLIENT_ID
        sync: false
      - key: GOOGLE_ADS_CLIENT_SECRET
        sync: false
      - key: GOOGLE_ADS_DEVELOPER_TOKEN
        sync: false
      - key: GOOGLE_ADS_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_ADS_MANAGER_ID
        sync: false
      - key: ADSCOM_API_KEY
        sync: false
      - key: ADSCOM_API_SECRET
        sync: false

  # Cron Job: Daily Exchange Rate Refresh
  # Automatically refreshes EUR/USD exchange rate every day at midnight UTC
  - type: cron
    name: exchange-rate-refresh
    env: node
    schedule: "0 0 * * *"  
    buildCommand: npm install
    startCommand: node scripts/refresh-exchange-rate.js
    envVars:
      - key: APP_URL
        sync: false  
      - key: NODE_ENV
        value: production

  # Cron Job: MongoDB Sync Worker
  # Syncs Google Ads cost + revenue data to MongoDB every 1 hour
  - type: cron
    name: mongodb-sync-worker
    env: node
    schedule: "0 * * * *"  # Every hour (at minute 0)
    buildCommand: npm install
    startCommand: node scripts/run-sync.js
    envVars:
      - key: NEXT_PUBLIC_APP_URL
        sync: false  
      - key: CRON_SECRET
        sync: false  
      - key: MONGODB_URI
        sync: false
      - key: NODE_ENV
        value: production

