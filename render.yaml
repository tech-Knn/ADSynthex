services:
  - type: web
    name: adsynthe-x
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GOOGLE_ADS_CLIENT_ID
        sync: false
      - key: GOOGLE_ADS_CLIENT_SECRET
        sync: false
      - key: GOOGLE_ADS_DEVELOPER_TOKEN
        sync: false
      - key: GOOGLE_ADS_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_ADS_MANAGER_ID
        sync: false
      - key: ADSCOM_API_KEY
        sync: false
      - key: ADSCOM_API_SECRET
        sync: false

  # Cron Job: AndroidAdvice Cache Warmer
  # Keeps androidadvice_aggregated:* Redis fresh so the dashboard reads
  # from cache (~300ms) instead of doing a cold fan-out across all
  # accounts. 5-min interval + 3-min aggregated cache TTL means every cron
  # cycle actually falls through and re-fetches active-account data from
  # Google Ads (was a no-op at 12min interval + 15min TTL).
  - type: cron
    name: androidadvice-cache-warmer
    env: node
    schedule: "*/5 * * * *"
    buildCommand: npm install
    startCommand: node scripts/warm-androidadvice.js
    envVars:
      - key: APP_URL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: NODE_ENV
        value: production

  # Cron Job: Daily Exchange Rate Refresh
  # Automatically refreshes EUR/USD exchange rate every day at midnight UTC
  - type: cron
    name: exchange-rate-refresh
    env: node
    schedule: "0 0 * * *"
    buildCommand: npm install
    startCommand: node scripts/refresh-exchange-rate.js
    envVars:
      - key: APP_URL
        sync: false
      - key: NODE_ENV
        value: production
